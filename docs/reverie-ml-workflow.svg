<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200" role="img" aria-labelledby="title desc">
  <title id="title">THREADLINE Reverie Hacks 2026 ML prompt-engineering workflow</title>
  <desc id="desc">Seven stages show human inputs; deterministic quarantine; five schema-constrained LLM operations and their prompts; exact source-span validation; deterministic timeline and candidate comparison; retrieval; contradiction and rival analysis; deterministic evidence contract; withholding or authorized human review; and audit and replay artifacts.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".3"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#b08a4c"/></marker>
    <style>
      .sans{font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif}.mono{font-family:'IBM Plex Mono',Consolas,monospace}.card{fill:#171511;stroke:#4d463a;stroke-width:1.5;filter:url(#shadow)}.contract{fill:#1c1810;stroke:#b08a4c;stroke-width:2}.out{fill:#12110e;stroke:#4d463a;stroke-width:1.5}.eyebrow{fill:#c2a66f;font-size:17px;font-weight:700;letter-spacing:4px}.hero{fill:#f3ecdf;font-size:50px;font-weight:600;letter-spacing:-1px}.sub{fill:#aaa194;font-size:19px}.num{fill:#988c7c;font-size:13px;font-weight:700;letter-spacing:2px}.h2{fill:#f3ecdf;font-size:26px;font-weight:600}.body{fill:#bcb2a4;font-size:16px}.strong{fill:#e8dfd2;font-size:16px;font-weight:600}.detail{fill:#999083;font-size:13px}.tag{font-size:11px;font-weight:700;letter-spacing:1.25px}.human{fill:#eadfc9}.humanText{fill:#16130f}.llm{fill:#9d5c44}.llmText{fill:#fff8ee}.retrieval{fill:#667360}.retrievalText{fill:#f4eee4}.det{fill:#342d22;stroke:#b08a4c;stroke-width:1}.detText{fill:#ead8b9}.line{fill:none;stroke:#b08a4c;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.rule{stroke:#403a31;stroke-width:1}.audit{fill:#0f0e0c;stroke:#403a31;stroke-width:1.5}.node{fill:#b08a4c}.nodeOpen{fill:#171511;stroke:#b08a4c;stroke-width:2}
    </style>
  </defs>
  <rect width="2000" height="1200" fill="#0d0c0a"/><path d="M0 165H2000M0 1090H2000" class="rule"/><circle cx="1810" cy="80" r="260" fill="#b08a4c" opacity=".025"/>
  <g class="sans">
    <text x="66" y="54" class="eyebrow">REVERIE HACKS 2026 / ML PROMPT ENGINEERING</text>
    <text x="66" y="112" class="hero">Probabilistic evidence. Deterministic release boundary.</text>
    <text x="66" y="146" class="sub">Synthetic research demonstration · possible connections for authorized review · never autonomous identity confirmation</text>
    <g transform="translate(1510 34)"><rect width="90" height="26" rx="4" class="human"/><text x="16" y="18" class="mono tag humanText">HUMAN</text><rect x="101" width="70" height="26" rx="4" class="llm"/><text x="121" y="18" class="mono tag llmText">LLM</text><rect x="182" width="116" height="26" rx="4" class="retrieval"/><text x="196" y="18" class="mono tag retrievalText">RETRIEVAL</text><rect x="309" width="146" height="26" rx="4" class="det"/><text x="323" y="18" class="mono tag detText">DETERMINISTIC</text><text x="0" y="55" class="mono detail">Offline: deterministic mock replay</text><text x="0" y="77" class="mono detail">Connected: provider + model recorded per run</text></g>

    <g transform="translate(66 215)"><rect width="350" height="300" rx="10" class="card"/><text x="24" y="35" class="mono num">01 / HUMAN INPUT</text><text x="24" y="75" class="h2">Incident + records</text><rect x="24" y="96" width="90" height="25" rx="4" class="human"/><text x="40" y="113" class="mono tag humanText">HUMAN</text><text x="24" y="158" class="body">Fictional source narratives</text><text x="24" y="184" class="body">Incident and candidate limits</text><text x="24" y="210" class="body">Authorized-review boundary</text><path d="M24 234H326" class="rule"/><text x="24" y="260" class="mono detail">IN · AnalyzeRequest + RecordInput[]</text><text x="24" y="282" class="mono detail">OUT · validated incident packet</text></g>

    <g transform="translate(450 215)"><rect width="440" height="300" rx="10" class="card"/><text x="24" y="35" class="mono num">02 / TRUST BOUNDARY</text><text x="24" y="75" class="h2">Quarantine + extraction</text><rect x="24" y="96" width="146" height="25" rx="4" class="det"/><text x="38" y="113" class="mono tag detText">DETERMINISTIC</text><rect x="182" y="96" width="70" height="25" rx="4" class="llm"/><text x="202" y="113" class="mono tag llmText">LLM 1</text><text x="24" y="157" class="strong">Prompt · extraction/v2</text><text x="24" y="181" class="detail">Model · runtime manifest (archived V2 model noted below)</text><text x="24" y="207" class="detail">Output · ExtractionModelOutput[]</text><text x="24" y="231" class="body">Untrusted text stays data, never instruction.</text><text x="24" y="255" class="body">Schema + exact quote/offset validation.</text><text x="24" y="279" class="detail">Invalid claims are withheld; original text is unchanged.</text></g>

    <g transform="translate(924 215)"><rect width="440" height="300" rx="10" class="card"/><text x="24" y="35" class="mono num">03 / REPRESENT</text><text x="24" y="75" class="h2">Normalize + timeline</text><rect x="24" y="96" width="70" height="25" rx="4" class="llm"/><text x="44" y="113" class="mono tag llmText">LLM 2</text><rect x="106" y="96" width="146" height="25" rx="4" class="det"/><text x="120" y="113" class="mono tag detText">DETERMINISTIC</text><text x="24" y="157" class="strong">Prompt · normalization/v1</text><text x="24" y="181" class="detail">Output · NormalizationModelOutput[]</text><text x="24" y="207" class="body">Native script and raw value remain authoritative.</text><text x="24" y="233" class="body">Canonical forms are separate comparison views.</text><text x="24" y="259" class="body">Timeline rules preserve exact versus estimated.</text><text x="24" y="283" class="detail">No translation, partial date, or missing value becomes proof.</text></g>

    <g transform="translate(1398 215)"><rect width="536" height="300" rx="10" class="card"/><text x="24" y="35" class="mono num">04 / SEARCH</text><text x="24" y="75" class="h2">Retrieve + compare candidates</text><rect x="24" y="96" width="116" height="25" rx="4" class="retrieval"/><text x="38" y="113" class="mono tag retrievalText">RETRIEVAL</text><rect x="152" y="96" width="146" height="25" rx="4" class="det"/><text x="166" y="113" class="mono tag detText">DETERMINISTIC</text><text x="24" y="157" class="body">Bounded top-k candidate generation</text><text x="24" y="183" class="body">Typed field comparison and blocking conflicts</text><text x="24" y="209" class="body">Weighted ranking signal — never identity probability</text><path d="M24 234H512" class="rule"/><text x="24" y="260" class="mono detail">OUT · CandidateConnection[]</text><text x="24" y="282" class="mono detail">MISSING ≠ AGREEMENT · SHARED CONTACT ≠ INDEPENDENT PROOF</text></g>
    <path d="M416 365H441M890 365H915M1364 365H1389" class="line"/>

    <g transform="translate(66 590)"><rect width="720" height="355" rx="10" class="card"/><text x="24" y="35" class="mono num">05 / ADVERSARIAL CHALLENGE</text><text x="24" y="75" class="h2">Hypothesis, contradiction, rivals</text><rect x="24" y="96" width="70" height="25" rx="4" class="llm"/><text x="44" y="113" class="mono tag llmText">LLM 3</text><rect x="106" y="96" width="70" height="25" rx="4" class="llm"/><text x="126" y="113" class="mono tag llmText">LLM 4</text><rect x="188" y="96" width="116" height="25" rx="4" class="retrieval"/><text x="202" y="113" class="mono tag retrievalText">RETRIEVAL</text><text x="24" y="157" class="strong">hypothesis/v1 · HypothesisModelOutput</text><text x="24" y="184" class="detail">Purpose: cite the strongest admissible support.</text><text x="24" y="216" class="strong">prosecutor/v1 · ProsecutorModelOutput</text><text x="24" y="243" class="detail">Purpose: expose contradiction independently.</text><text x="24" y="275" class="strong">Rival-candidate test · RivalComparison[]</text><text x="24" y="302" class="detail">Purpose: compare the leader with nearby alternatives.</text><path d="M450 142V310" class="rule"/><text x="476" y="165" class="mono detail">VALIDATION BOUNDARY</text><text x="476" y="196" class="body">Every factor cites a valid span.</text><text x="476" y="223" class="body">Absence is not contradiction.</text><text x="476" y="250" class="body">Hard conflicts stay hard.</text><text x="476" y="277" class="body">Close rivals remain visible.</text><text x="476" y="304" class="body">No stronger state is permitted.</text></g>

    <g transform="translate(820 590)"><rect width="560" height="355" rx="10" class="card contract"/><text x="24" y="35" class="mono num">06 / RELEASE BOUNDARY</text><text x="24" y="75" class="h2">Adjudicate + evidence contract</text><rect x="24" y="96" width="70" height="25" rx="4" class="llm"/><text x="44" y="113" class="mono tag llmText">LLM 5</text><rect x="106" y="96" width="146" height="25" rx="4" class="det"/><text x="120" y="113" class="mono tag detText">DETERMINISTIC</text><text x="24" y="158" class="strong">Prompt · adjudication/v1</text><text x="24" y="183" class="detail">Output · AdjudicationModelOutput[]</text><text x="24" y="215" class="body">Transition guard: preserve or downgrade only.</text><text x="24" y="241" class="body">Privacy-safe reviewer packet.</text><text x="24" y="267" class="body">18 deterministic evidence-contract rules.</text><text x="24" y="293" class="body">Blocking conflict clears external classification.</text><path d="M24 315H536" class="rule"/><text x="24" y="338" class="mono detail">LLM CANNOT OVERRIDE A DETERMINISTIC BLOCK</text></g>

    <g transform="translate(1414 590)"><rect width="520" height="355" rx="10" class="card"/><text x="24" y="35" class="mono num">07 / OUTPUT + HUMAN DISPOSITION</text><text x="24" y="75" class="h2">Withhold or hand off</text><g transform="translate(24 100)"><rect width="224" height="164" rx="8" class="out"/><rect x="18" y="17" width="146" height="25" rx="4" class="det"/><text x="32" y="34" class="mono tag detText">DETERMINISTIC</text><text x="18" y="78" class="strong">WITHHELD</text><text x="18" y="104" class="body">Material conflict</text><text x="18" y="128" class="body">remains unresolved.</text><path d="M18 145H92M126 145H202" stroke="#9d5c44" stroke-width="2"/></g><g transform="translate(272 100)"><rect width="224" height="164" rx="8" class="out"/><rect x="18" y="17" width="90" height="25" rx="4" class="human"/><text x="34" y="34" class="mono tag humanText">HUMAN</text><text x="18" y="78" class="strong">REVIEW PACKET</text><text x="18" y="104" class="body">Possible connection,</text><text x="18" y="128" class="body">never a conclusion.</text><circle cx="20" cy="145" r="5" class="node"/><path d="M26 145H197" stroke="#b08a4c" stroke-width="2"/><circle cx="203" cy="145" r="6" class="nodeOpen"/></g><text x="24" y="298" class="body">Human options are governed outside model output.</text><text x="24" y="326" class="mono detail">OUT · WITHHELD | AUTHORIZED HUMAN REVIEW REQUIRED</text></g>
    <path d="M1666 515V550H426V580" class="line"/><path d="M786 768H811M1380 768H1405" class="line"/>

    <g transform="translate(66 1010)"><rect width="1868" height="64" rx="8" class="audit"/><circle cx="28" cy="32" r="6" class="node"/><path d="M35 32H1834" stroke="#6d5c43" stroke-width="1.5"/><circle cx="1840" cy="32" r="6" class="nodeOpen"/><text x="52" y="26" class="mono num">AUDIT + REPLAY / ATTACHED TO EVERY RUN</text><text x="52" y="49" class="body">Source spans · prompt/template IDs · provider/model/config · rule outcomes · run and fixture hashes · append-only events · replay manifests · counterfactual certificates</text></g>
    <text x="66" y="1132" class="mono detail">Archived production-prompt evidence: OpenAI-compatible · Qwen/Qwen3-30B-A3B-Instruct-2507 · extraction/v2 · temperature 0 · one synthetic run.</text>
    <text x="66" y="1156" class="mono detail">Runtime model identity is recorded per run. Offline deterministic replay exercises workflow behavior and is explicitly not model-performance evidence.</text>
  </g>
</svg>
