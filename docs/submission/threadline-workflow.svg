<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">THREADLINE evidence-first review workflow</title>
  <desc id="desc">Seven stages show human inputs, quarantine, five constrained model nodes, deterministic validation, retrieval, contradiction and rival analysis, an evidence contract, authorized human review, withholding, and replay artifacts.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b08a4c"/></marker>
    <style>
      .sans{font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif}.mono{font-family:'IBM Plex Mono',Consolas,monospace}.stage{fill:#171511;stroke:#4b4439;stroke-width:1.4;filter:url(#shadow)}.stage-contract{fill:#1d1911;stroke:#b08a4c;stroke-width:2}.outcome{fill:#15130f;stroke:#51493d;stroke-width:1.5}.eyebrow{fill:#b99a66;font-size:17px;font-weight:600;letter-spacing:4px}.title{fill:#f1eadf;font-size:49px;font-weight:600;letter-spacing:-1px}.subtitle{fill:#aaa194;font-size:20px}.stage-no{fill:#8b8173;font-size:13px;font-weight:600;letter-spacing:1.8px}.stage-title{fill:#f1eadf;font-size:25px;font-weight:600}.body{fill:#b9b0a3;font-size:16px}.body-strong{fill:#e2d9cc;font-size:16px;font-weight:600}.detail{fill:#92897d;font-size:13.5px}.label{font-size:12px;font-weight:700;letter-spacing:1.2px}.human{fill:#eadfc9;stroke:#eadfc9}.human-text{fill:#171511}.llm{fill:#9d5c44;stroke:#9d5c44}.llm-text{fill:#fff8ee}.retrieval{fill:#667360;stroke:#82907a}.retrieval-text{fill:#f2eee4}.det{fill:#342d22;stroke:#b08a4c}.det-text{fill:#e9d8bb}.route{fill:none;stroke:#b08a4c;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.route-muted{fill:none;stroke:#62594c;stroke-width:1.4;stroke-dasharray:6 7}.audit{fill:#100f0c;stroke:#3c372f;stroke-width:1.3}.node{fill:#b08a4c}.node-open{fill:#171511;stroke:#b08a4c;stroke-width:2}.rule{stroke:#3f3930;stroke-width:1}
    </style>
  </defs>
  <rect width="1800" height="1100" fill="#0d0c0a"/><path d="M0 162H1800M0 1018H1800" class="rule" opacity="0.7"/><circle cx="1605" cy="95" r="235" fill="#b08a4c" opacity="0.025"/><circle cx="130" cy="1040" r="260" fill="#9d5c44" opacity="0.02"/>
  <g class="sans">
    <text x="62" y="58" class="eyebrow">THREADLINE / PROPOSED RECORD CONNECTIONS</text><text x="62" y="115" class="title">Probabilistic evidence. Deterministic release boundary.</text><text x="62" y="146" class="subtitle">A synthetic research demonstration for authorized review - never autonomous identity confirmation.</text>
    <g transform="translate(1268 42)"><rect width="95" height="25" rx="4" class="human"/><text x="14" y="17" class="mono label human-text">HUMAN</text><rect x="107" width="78" height="25" rx="4" class="llm"/><text x="126" y="17" class="mono label llm-text">LLM</text><rect x="197" width="126" height="25" rx="4" class="retrieval"/><text x="211" y="17" class="mono label retrieval-text">RETRIEVAL</text><rect x="335" width="151" height="25" rx="4" class="det"/><text x="349" y="17" class="mono label det-text">DETERMINISTIC</text><text x="0" y="53" class="mono detail">Model/provider: runtime manifest</text><text x="0" y="73" class="mono detail">Offline path: deterministic mock replay</text><text x="0" y="93" class="mono detail">Connected path: LLM_PROVIDER + LLM_MODEL</text></g>
    <g transform="translate(62 215)"><rect width="235" height="265" rx="10" class="stage"/><text x="22" y="34" class="mono stage-no">01 / SCOPE</text><text x="22" y="72" class="stage-title">Human inputs</text><rect x="22" y="92" width="95" height="24" rx="4" class="human"/><text x="36" y="109" class="mono label human-text">HUMAN</text><text x="22" y="148" class="body">Incident limits</text><text x="22" y="174" class="body">Fictional source records</text><text x="22" y="200" class="body">Review authority</text><path d="M22 221H213" class="rule"/><text x="22" y="246" class="mono detail">AnalyzeRequest</text></g>
    <g transform="translate(332 215)"><rect width="310" height="265" rx="10" class="stage"/><text x="22" y="34" class="mono stage-no">02 / BOUNDARY</text><text x="22" y="72" class="stage-title">Quarantine + extract</text><rect x="22" y="92" width="151" height="24" rx="4" class="det"/><text x="36" y="109" class="mono label det-text">DETERMINISTIC</text><rect x="181" y="92" width="78" height="24" rx="4" class="llm"/><text x="200" y="109" class="mono label llm-text">LLM</text><text x="22" y="148" class="body-strong">quarantine - tested patterns</text><text x="22" y="174" class="body-strong">extraction/v2</text><text x="22" y="199" class="detail">Expected: ExtractionModelOutput[]</text><text x="22" y="222" class="detail">Validate: Pydantic + exact quote offsets</text><text x="22" y="245" class="detail">Untrusted text never becomes instruction</text></g>
    <g transform="translate(677 215)"><rect width="310" height="265" rx="10" class="stage"/><text x="22" y="34" class="mono stage-no">03 / REPRESENT</text><text x="22" y="72" class="stage-title">Normalize + timeline</text><rect x="22" y="92" width="78" height="24" rx="4" class="llm"/><text x="41" y="109" class="mono label llm-text">LLM</text><rect x="108" y="92" width="151" height="24" rx="4" class="det"/><text x="122" y="109" class="mono label det-text">DETERMINISTIC</text><text x="22" y="148" class="body-strong">normalization/v1</text><text x="22" y="174" class="detail">Expected: NormalizationModelOutput[]</text><text x="22" y="198" class="body">Original form stays authoritative</text><text x="22" y="222" class="body">Time remains exact or estimated</text><text x="22" y="246" class="detail">No equivalence claim from translation</text></g>
    <g transform="translate(1022 215)"><rect width="250" height="265" rx="10" class="stage"/><text x="22" y="34" class="mono stage-no">04 / SEARCH</text><text x="22" y="72" class="stage-title">Candidate retrieval</text><rect x="22" y="92" width="126" height="24" rx="4" class="retrieval"/><text x="36" y="109" class="mono label retrieval-text">RETRIEVAL</text><text x="22" y="151" class="body">Bounded candidate pairs</text><text x="22" y="177" class="body">Field-level comparisons</text><text x="22" y="203" class="body">Deterministic safety state</text><path d="M22 221H228" class="rule"/><text x="22" y="246" class="mono detail">Score is not probability</text></g>
    <g transform="translate(1307 215)"><rect width="431" height="265" rx="10" class="stage"/><text x="22" y="34" class="mono stage-no">05 / CHALLENGE</text><text x="22" y="72" class="stage-title">Hypothesis + opposition + rivals</text><rect x="22" y="92" width="78" height="24" rx="4" class="llm"/><text x="41" y="109" class="mono label llm-text">LLM</text><rect x="108" y="92" width="126" height="24" rx="4" class="retrieval"/><text x="122" y="109" class="mono label retrieval-text">RETRIEVAL</text><text x="22" y="147" class="body-strong">hypothesis/v1 - HypothesisModelOutput</text><text x="22" y="173" class="body-strong">prosecutor/v1 - ProsecutorModelOutput</text><text x="22" y="199" class="body-strong">rival-candidate test - nearby alternatives</text><text x="22" y="224" class="detail">Cited spans only; hard conflicts cannot be erased</text><text x="22" y="247" class="detail">A close rival can force abstention</text></g>
    <path d="M297 348H323" class="route"/><path d="M642 348H668" class="route"/><path d="M987 348H1013" class="route"/><path d="M1272 348H1298" class="route"/>
    <g transform="translate(332 565)"><rect width="735" height="280" rx="10" class="stage stage-contract"/><text x="24" y="35" class="mono stage-no">06 / RESOLVE THE BOUNDARY</text><text x="24" y="76" class="stage-title">Adjudication, review packet, evidence contract</text><rect x="24" y="98" width="78" height="24" rx="4" class="llm"/><text x="43" y="115" class="mono label llm-text">LLM</text><rect x="110" y="98" width="151" height="24" rx="4" class="det"/><text x="124" y="115" class="mono label det-text">DETERMINISTIC</text><rect x="269" y="98" width="95" height="24" rx="4" class="human"/><text x="283" y="115" class="mono label human-text">HUMAN</text><text x="24" y="158" class="body-strong">adjudication/v1 - AdjudicationModelOutput[]</text><text x="24" y="184" class="detail">May preserve or downgrade; deterministic blocks are the safety floor</text><text x="24" y="215" class="body-strong">privacy gate + authorized-review routing</text><text x="24" y="241" class="body-strong">18 deterministic contract rules - exact result for every rule</text><text x="24" y="265" class="detail">Failed blocking rule clears classification before external release</text><path d="M510 103H685" class="route-muted"/><circle cx="510" cy="103" r="5" class="node"/><circle cx="685" cy="103" r="6" class="node-open"/></g>
    <g transform="translate(1122 565)"><rect width="616" height="280" rx="10" class="stage"/><text x="24" y="35" class="mono stage-no">07 / DISPOSITION</text><text x="24" y="76" class="stage-title">Withhold or hand off</text><g transform="translate(24 102)"><rect width="270" height="130" rx="8" class="outcome"/><rect x="18" y="18" width="151" height="24" rx="4" class="det"/><text x="32" y="35" class="mono label det-text">DETERMINISTIC</text><text x="18" y="72" class="body-strong">Release withheld</text><text x="18" y="98" class="body">Material evidence unresolved</text><path d="M18 113H122M152 113H250" stroke="#9d5c44" stroke-width="2"/></g><g transform="translate(314 102)"><rect width="278" height="130" rx="8" class="outcome"/><rect x="18" y="18" width="95" height="24" rx="4" class="human"/><text x="32" y="35" class="mono label human-text">HUMAN</text><text x="18" y="72" class="body-strong">Authorized human review</text><text x="18" y="98" class="body">Evidence packet - not a conclusion</text><circle cx="20" cy="114" r="5" class="node"/><path d="M25 114H252" stroke="#b08a4c" stroke-width="2"/></g></g>
    <path d="M1522 480V520H700V556" class="route"/><path d="M1067 705H1113" class="route"/>
    <g transform="translate(62 915)"><rect width="1676" height="78" rx="8" class="audit"/><circle cx="30" cy="39" r="6" class="node"/><path d="M36 39H1640" stroke="#6b5b42" stroke-width="1.5"/><circle cx="1646" cy="39" r="6" class="node-open"/><text x="54" y="31" class="mono stage-no">AUDIT + REPLAY ARTIFACTS / ALWAYS ATTACHED</text><text x="54" y="55" class="body">Exact source spans - prompt/template versions - provider metadata - rule outcomes - hash-chain verification - deterministic mock replay - counterfactual certificates</text></g>
    <text x="62" y="1058" class="mono detail">LLM nodes use schema-constrained output. Production extraction prompt: extraction/v2. Other model prompts: normalization/v1, hypothesis/v1, prosecutor/v1, adjudication/v1.</text><text x="62" y="1081" class="mono detail">Archived extraction run: OpenAI-compatible / Qwen/Qwen3-30B-A3B-Instruct-2507 / temperature 0. Runtime model identity is recorded in each run manifest.</text>
  </g>
</svg>
