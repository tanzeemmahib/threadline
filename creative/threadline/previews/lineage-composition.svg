<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Evidence lineage composition</title><desc id="d">Four-stage reverse provenance flow from candidate claim to exact source span.</desc><rect width="1600" height="900" fill="#07131F"/><text x="80" y="78" fill="#49C9D8" font-family="monospace" font-size="16" letter-spacing="3">REVERSE PROVENANCE / CF-NAME</text><text x="80" y="142" fill="#F3F7F8" font-family="Arial,sans-serif" font-size="43" font-weight="600">Travel from claim to original source.</text><text x="80" y="184" fill="#B8C7CD" font-family="Arial,sans-serif" font-size="20">Each layer preserves the exact evidence and the transformation that produced it.</text>
  <path d="M190 300H1410" stroke="#49C9D8" stroke-width="2"/><g font-family="monospace" font-size="14"> <g transform="translate(110 270)"><circle cx="80" cy="30" r="28" fill="#07131F" stroke="#49C9D8" stroke-width="2"/><text x="69" y="35" fill="#49C9D8">01</text><text x="0" y="95" fill="#F3F7F8" font-family="Arial" font-size="20" font-weight="700">Candidate claim</text><text x="0" y="125" fill="#91A5AE">Reviewer-facing claim</text></g><g transform="translate(500 270)"><circle cx="80" cy="30" r="28" fill="#07131F" stroke="#49C9D8" stroke-width="2"/><text x="69" y="35" fill="#49C9D8">02</text><text x="0" y="95" fill="#F3F7F8" font-family="Arial" font-size="20" font-weight="700">Normalized claim</text><text x="0" y="125" fill="#91A5AE">Comparable representation</text></g><g transform="translate(890 270)"><circle cx="80" cy="30" r="28" fill="#07131F" stroke="#49C9D8" stroke-width="2"/><text x="69" y="35" fill="#49C9D8">03</text><text x="0" y="95" fill="#F3F7F8" font-family="Arial" font-size="20" font-weight="700">Extracted evidence</text><text x="0" y="125" fill="#91A5AE">Typed field + certainty</text></g><g transform="translate(1280 270)"><circle cx="80" cy="30" r="28" fill="#49C9D8" stroke="#49C9D8" stroke-width="2"/><text x="1349" y="305" fill="#07131F">04</text><text x="0" y="95" fill="#F3F7F8" font-family="Arial" font-size="20" font-weight="700">Exact source span</text><text x="0" y="125" fill="#91A5AE">Immutable original text</text></g></g>
  <rect x="80" y="470" width="1440" height="330" rx="12" fill="#0B1E2D" stroke="#9BE7ED" stroke-opacity=".25"/><text x="120" y="520" fill="#91A5AE" font-family="monospace" font-size="14">LAYER 04 · FAMILY-018 · [14, 27) · EXACT</text><text x="120" y="585" fill="#B8C7CD" font-family="Arial,sans-serif" font-size="28">…family report names </text><rect x="386" y="548" width="230" height="55" fill="#49C9D8" fill-opacity=".18"/><text x="400" y="585" fill="#F3F7F8" font-family="Arial,sans-serif" font-size="28">يوسف الحسن</text><text x="625" y="585" fill="#B8C7CD" font-family="Arial,sans-serif" font-size="28"> and records an approximate last-seen time…</text><text x="120" y="665" fill="#49C9D8" font-family="monospace" font-size="15">OPEN EXACT SOURCE SPAN ↗</text><text x="120" y="735" fill="#91A5AE" font-family="monospace" font-size="14">Candidate claim → normalized claim → extracted evidence → exact original source span</text></svg>
