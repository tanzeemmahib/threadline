<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Contradiction workspace composition</title><desc id="d">Side-by-side source comparison preserving a soft age contradiction and an unresolved gap.</desc><rect width="1600" height="900" fill="#07131F"/><text x="80" y="76" fill="#F1C66D" font-family="monospace" font-size="16" letter-spacing="3">CONTRADICTION WORKSPACE / CONFLICT-AGE-01</text><text x="80" y="138" fill="#F3F7F8" font-family="Arial,sans-serif" font-size="42" font-weight="600">Opposing evidence stays visible.</text><text x="80" y="178" fill="#B8C7CD" font-family="Arial,sans-serif" font-size="20">Uncertainty is compared at the source, never hidden behind a single score.</text><rect x="80" y="230" width="1440" height="560" rx="12" fill="#0B1E2D" stroke="#9BE7ED" stroke-opacity=".2"/><line x1="800" y1="230" x2="800" y2="790" stroke="#9BE7ED" stroke-opacity=".16"/><g font-family="Arial,sans-serif"><text x="125" y="285" fill="#91A5AE" font-family="monospace" font-size="14">FAMILY-018 · ARABIC · EXACT</text><text x="125" y="340" fill="#F3F7F8" font-size="25" font-weight="700">Age recorded as 14</text><rect x="125" y="385" width="610" height="130" rx="6" fill="#081824"/><rect x="157" y="420" width="190" height="48" fill="#F1C66D" fill-opacity=".16"/><text x="155" y="455" fill="#F3F7F8" font-size="25">العمر أربعة عشر</text><text x="125" y="570" fill="#91A5AE" font-family="monospace" font-size="14">OFFSETS [62, 79) · CERTAINTY EXACT</text><text x="125" y="690" fill="#F1C66D" font-family="monospace" font-size="15">SOFT CONTRADICTION</text><text x="125" y="725" fill="#B8C7CD" font-size="18">One-year difference may reflect estimated intake age.</text><text x="845" y="285" fill="#91A5AE" font-family="monospace" font-size="14">SHELTER-204 · ENGLISH · ESTIMATED</text><text x="845" y="340" fill="#F3F7F8" font-size="25" font-weight="700">Age estimated as 15</text><rect x="845" y="385" width="610" height="130" rx="6" fill="#081824"/><rect x="877" y="420" width="280" height="48" fill="#F1C66D" fill-opacity=".16"/><text x="875" y="455" fill="#F3F7F8" font-size="25">approximately fifteen</text><text x="845" y="570" fill="#91A5AE" font-family="monospace" font-size="14">OFFSETS [41, 62) · CERTAINTY ESTIMATED</text><text x="845" y="690" fill="#91A5AE" font-family="monospace" font-size="15">UNRESOLVED GAP / SCAR DETAIL</text><text x="845" y="725" fill="#B8C7CD" font-size="18">Absence in one record is not inferred as contradiction.</text></g></svg>
